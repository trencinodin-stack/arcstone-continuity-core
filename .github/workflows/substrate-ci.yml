# Master Substrate Phase 7 Continuous Integration Validation Gate
name: "Master Substrate Phase 7 CI Gate"

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-substrate-invariants:
    name: "Cross-Tier Invariant Verification Run"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Master Substrate Repository"
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: "Initialize Environment and Test Harness"
        run: |
          echo "[TARGET HASH ANCHOR]: A-77-DELTA-SHIELD-LOCKED"
          echo "[BASELINE RELEASE]: v1.3.0-exec"

      - name: "Execute Lifecycle Invariant Harness"
        run: npm run test:unit -- --file=tests/validateLifecycleInvariants.ts

      - name: "Execute Clock Drift Lattice Suites"
        run: npm run test:unit -- --file=tests/clockDriftLattice.test.ts

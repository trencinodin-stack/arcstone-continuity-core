# Master Substrate Phase 7 Continuous Integration Validation Gate
name: "Master Substrate Phase 7 CI Gate"

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-substrate-invariants:
    name: "Cross-Tier Invariant Verification Run"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Master Substrate Repository"
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Execute Native Rust Invariant Tests"
        run: cargo test --lib

      - name: "Set up Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Install Dependencies"
        run: npm install

      - name: "Execute Lifecycle Invariant Harness"
        run: npm run test:unit -- tests/validateLifecycleInvariants.ts

      - name: "Execute Clock Drift Lattice Suites"
        run: npm run test:unit -- tests/clockDriftLattice.test.ts
